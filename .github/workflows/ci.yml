name: Verify studio
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest --cov=simlab --cov-fail-under=85 --cov-report=xml
      - run: node --test tools/check_model_graph.cjs
      - run: npm install --no-save --package-lock=false playwright
      - name: Browser reliability checks with injected AI
        shell: pwsh
        run: |
          $env:STUDIO_TEST_URL = 'http://127.0.0.1:8876'
          $fixture = Start-Process python -ArgumentList 'tests/studio_browser_fixture.py' -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try { Invoke-RestMethod "$env:STUDIO_TEST_URL/fixture-health" | Out-Null; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (!$ready) { throw 'Fixture startup failed' }
            node tools/check_reliability_browser.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Reliability regression failed' }
            node tools/check_productivity_browser.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Productivity regression failed' }
          } finally { Stop-Process -Id $fixture.Id -ErrorAction SilentlyContinue }

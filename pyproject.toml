[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simpy-lab-studio"
version = "1.3.0"
description = "Windows manufacturing simulation workspace with model editing, AI assistance and reproducible experiments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SimPy Lab Studio" }]
dependencies = [
  "simpy>=4.1.1,<5",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "openai>=1.68.0,<3",
]

[project.optional-dependencies]
desktop = [
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pywebview>=6.2,<7; sys_platform == 'win32'",
]
desktop-build = [
  "pyinstaller>=6.16,<7",
  "Pillow>=11,<13",
]
studio = [
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
dev = [
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=2,<3",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
  "uvicorn[standard]>=0.30,<1",
  "matplotlib>=3.8,<4",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
mcp = [
  "httpx>=0.28,<1",
  "mcp>=2,<3",
]
viz = [
  "matplotlib>=3.8,<4",
]
docs = [
  "python-docx>=1.2,<2",
]

[project.scripts]
simlab = "simlab.cli:main"
simlab-mcp = "simlab.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simlab = ["static/studio/*", "static/studio/vendor/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
